events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting — 10 req/s per IP, burst 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # DNS resolver for runtime host resolution (Docker internal DNS)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # HTTP → HTTPS redirect
    server {
        listen 80;

        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # Modern TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Health check (no auth/proxy needed)
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Proxy API requests to the Spring Boot backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            set $backend "app:8080";
            proxy_pass http://$backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket/Chat support (Spring AI streaming)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Buffering for large AI chat responses
            proxy_buffering off;
        }

        # Deny everything else
        location / {
            return 404;
        }
    }
}

app:
  cors:
    # Exact origins, comma-separated. Overridden per profile, and at deploy time
    # by APP_CORS_ALLOWED_ORIGINS with no rebuild.
    # An origin is scheme://host[:port] — no path, no trailing slash.
    allowed-origins: https://app.example.com

spring:
  application:
    name: routinemanager

  profiles:
    active: local

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  ai:
    active: true
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
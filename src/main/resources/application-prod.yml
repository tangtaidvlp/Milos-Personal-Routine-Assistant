app:
  cors:
    # Set APP_CORS_ALLOWED_ORIGINS on the instance to the real SPA origin.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://app.example.com}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # validate, never update: Hibernate must not mutate the production schema
      # on startup. Schema changes belong in migrations.
      ddl-auto: validate
    open-in-view: false

  h2:
    console:
      enabled: false

server:
  # Caddy terminates TLS and proxies to :8080, so honour X-Forwarded-* when
  # building absolute URLs and deciding whether the request was secure.
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    com.tom.payment.routinemanager: INFO

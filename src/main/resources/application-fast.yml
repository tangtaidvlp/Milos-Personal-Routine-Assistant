app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    # application.yml pins the PostgreSQL dialect; H2 needs its own (e.g. row
    # locks: Postgres emits FOR NO KEY UPDATE, which H2 rejects).
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tom.payment'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('release', Copy) {
	group = 'distribution'
	description = 'Builds the executable jar and copies it into release/ as routinemanager-<version>.jar'

	dependsOn tasks.named('bootJar')

	from(tasks.named('bootJar'))
	into layout.projectDirectory.dir('release')
	rename { "routinemanager-${version}.jar" }
}

tasks.register('runRelease', Exec) {
	group = 'application'
	description = 'Runs the most recently built jar in release/ (via java -jar)'

	doFirst {
		def releaseDir = layout.projectDirectory.dir('release').asFile
		def jars = releaseDir.exists() ? releaseDir.listFiles({ f -> f.name.endsWith('.jar') } as FileFilter) : null
		if (!jars) {
			throw new GradleException("No jar found in release/. Run './gradlew release' first.")
		}
		def latestJar = jars.max { it.lastModified() }
		commandLine 'java', '-jar', latestJar.absolutePath
	}
}

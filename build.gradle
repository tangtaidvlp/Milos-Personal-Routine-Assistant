plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tom.payment'
version = '0.0.3-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// F008: MockMvc with the security filter chain, and Postgres via Testcontainers
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

// Database for tests (F008): -PtestDb=h2 (default, in-memory) or -PtestDb=postgres
// (Testcontainers, needs Docker). TEST_DB=... works too. CI uses postgres.
def testDb = (findProperty('testDb') ?: System.getenv('TEST_DB') ?: 'h2').toString()
if (!(testDb in ['h2', 'postgres'])) {
	throw new GradleException("testDb must be 'h2' or 'postgres', got '${testDb}'")
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'test.db', testDb
	inputs.property('testDb', testDb)
}

tasks.register('release', Copy) {
	group = 'distribution'
	description = 'Builds the executable jar and copies it into release/ as routinemanager-<version>.jar'

	dependsOn tasks.named('bootJar')

	from(tasks.named('bootJar'))
	into layout.projectDirectory.dir('release')
	rename { "routinemanager-${version}.jar" }
}

tasks.register('runRelease', Exec) {
	group = 'application'
	description = 'Runs the most recently built jar in release/ (via java -jar). Pass -Pprofile=<name> to set spring.profiles.active'

	doFirst {
		def releaseDir = layout.projectDirectory.dir('release').asFile
		def jars = releaseDir.exists() ? releaseDir.listFiles({ f -> f.name.endsWith('.jar') } as FileFilter) : null
		if (!jars) {
			throw new GradleException("No jar found in release/. Run './gradlew release' first.")
		}
		def latestJar = jars.max { it.lastModified() }
		def command = ['java', '-jar', latestJar.absolutePath]
		if (project.hasProperty('profile')) {
			command << "--spring.profiles.active=${project.property('profile')}"
		}
		commandLine command
	}
}
